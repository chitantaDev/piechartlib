<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Budget Pie Chart</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
<body>    
    <div class="container">
        <!-- Circle visualization -->
        <canvas id="myCanvas" width="300" height="300"></canvas>
        
        <!-- Bar visualization with draggable pointers -->
        <div class="bar-container">
            <div id="segmentBar" class="segment-bar"></div>
            <div id="pointerContainer" class="pointer-container"></div>
        </div>
        
        <!-- Two-column layout for controls and segment stats -->
        <div class="flex-container">
            <!-- Left column: Controls -->
            <div class="column">
                <div class="controls">
                    <!-- Basic controls -->
                    <div class="control-row">
                        <label for="segments">Number of segments:</label>
                        <input type="number" id="segments" min="2" max="10" value="4">
                    </div>
                    
                    <div class="control-row">
                        <label>Selected segment:</label>
                        <span id="currentSegment">1</span>
                    </div>
                    
                    <div class="control-row">
                        <label>Current size:</label>
                        <span id="segmentSize">25%</span>
                    </div>
                    
                    <!-- Total Value -->
                    <div class="control-row">
                        <label>Total Value (€):</label>
                        <input type="number" id="totalValue" value="1000" min="1">
                    </div>
                    
                    <!-- Color selection -->
                    <div class="control-row">
                        <label for="colorPicker">Selected color:</label>
                        <div class="color-picker-container">
                            <input type="color" id="colorPicker" value="#FFB6C1">
                            <div class="color-preview" id="colorPreview"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right column: Segment stats -->
            <div class="column">
                <div id="segmentStats" class="segment-stats-container">
                    <div class="segment-stats-title">All Segments</div>
                    <!-- Segment stats will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
